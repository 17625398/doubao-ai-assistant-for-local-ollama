version: '3.8'

services:
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: lightpanda-browser
    ports:
      - "9222:9222"
    environment:
      - LIGHTPANDA_DISABLE_TELEMETRY=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9222"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - doubao-network

networks:
  doubao-network:
    driver: bridge
