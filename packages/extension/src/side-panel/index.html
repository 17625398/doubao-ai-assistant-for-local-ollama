<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆包 AI 工作台</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="hero">
      <div class="brand-row">
        <div class="brand-mark">豆</div>
        <div>
          <div class="brand-title">豆包 AI 工作台</div>
          <div class="brand-subtitle">网页阅读 · 技能插件 · Canvas Artifact</div>
        </div>
      </div>
      <button id="refresh-context" class="ghost-button">重新提取</button>
      <button id="run-diagnostics" class="ghost-button">诊断</button>
      <button id="toggle-history" class="ghost-button">历史</button>
    </header>

    <section id="context-card" class="context-card loading">
      <div class="context-kicker">当前页面</div>
      <h1 id="page-title">等待页面上下文</h1>
      <p id="page-url">打开网页后点击右下角豆包按钮，或使用右键菜单。</p>
      <div class="stats-grid">
        <div><strong id="stat-chars">--</strong><span>字符</span></div>
        <div><strong id="stat-headings">--</strong><span>标题</span></div>
        <div><strong id="stat-links">--</strong><span>链接</span></div>
        <div><strong id="stat-images">--</strong><span>图片</span></div>
      </div>
    </section>

    <section class="skill-section">
      <div class="section-title">
        <span>技能入口</span>
        <small>本地先编排，模型服务可替换</small>
      </div>
      <div class="skill-grid">
        <button class="skill-card" data-skill="summarize"><b>总结</b><span>提炼重点</span></button>
        <button class="skill-card" data-skill="translate"><b>翻译</b><span>偏好语言</span></button>
        <button class="skill-card" data-skill="deep-search"><b>深度搜索</b><span>扩展资料</span></button>
        <button class="skill-card" data-skill="extract-outline"><b>大纲</b><span>结构化</span></button>
        <button class="skill-card" data-skill="write-email"><b>写邮件</b><span>商务表达</span></button>
        <button class="skill-card" data-skill="code-review"><b>代码审查</b><span>质量安全</span></button>
        <button class="skill-card" data-skill="diagnose-page"><b>页面诊断</b><span>上下文质量</span></button>
      </div>
    </section>

    <section id="history-panel" class="history-panel hidden">
      <div class="section-title">
        <span>Artifact 历史</span>
        <small id="history-count">0 条</small>
      </div>
      <div class="history-actions">
        <button id="export-history" class="mini-button">导出 Markdown</button>
        <button id="export-history-json" class="mini-button">导出 JSON</button>
        <button id="clear-history" class="mini-button danger">清空</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section class="result-panel">
      <div class="section-title">
        <span>Canvas Artifact</span>
        <small id="result-time">尚未生成</small>
      </div>
      <div id="result-empty" class="empty-state">
        <div class="empty-icon">✦</div>
        <h2>选择一个技能开始</h2>
        <p>侧边栏会优先调用已配置模型；模型不可用时自动回退到本地结构化结果。</p>
      </div>
      <div id="result-content" class="result-content hidden"></div>
    </section>

    <footer class="composer">
      <textarea id="prompt-input" placeholder="追加你的要求，例如：输出为表格 / 面向老板汇报 / 翻译为英文"></textarea>
      <button id="run-custom" class="primary-button">发送</button>
    </footer>
  </div>
</body>
</html>
