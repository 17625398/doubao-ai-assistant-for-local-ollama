name: CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "*"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: ESLint (web)
        run: npm --workspace @ai-intelligent-analysis-platform/web run lint:eslint
        continue-on-error: true
